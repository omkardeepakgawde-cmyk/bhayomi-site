<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhayomi</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 2.2rem;
    }
    p {
      line-height: 1.6;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to Bhayomi</h1>
    <p>This is a simple, fast, static webpage hosted for free on our custom domain.</p>
    <p>More stories and updates coming soon.</p>
  </main>
</body>
</html>
